<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AQUILLA CORPORATION - USADP</title>
  <meta name="description" content="Login flow — initiate connection then enter MOONSHINE." />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-black text-white">
  <div class="background-decor" aria-hidden="true">
    <div class="glow"></div>
    <svg class="circles" viewBox="0 0 800 600" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" x2="1">
          <stop offset="0%" stop-color="#061826" />
          <stop offset="100%" stop-color="#00151f" />
        </linearGradient>
      </defs>
      <rect width="100%" height="100%" fill="url(#g1)" />
    </svg>

    <!-- optional watermark (if images/logo.png exists in repo) -->
    <img src="images/logo.png" alt="" class="logo-watermark" />
  </div>

  <main class="page-center">
    <section class="card login-card" aria-labelledby="login-heading">
      <h1 id="login-heading" class="brand">AQUILLA CORPORATION - USADP</h1>

      <p class="lead muted">Secure Access Portal</p>

      <div id="step-init" class="step">
        <p class="muted">Connection status: <strong id="conn-status">Disconnected</strong></p>
        <button id="initBtn" class="btn btn-primary" aria-controls="conn-status">Initiate connection</button>
      </div>

      <div id="step-pass" class="step hidden" aria-hidden="true">
        <p class="muted">Connection initialised. Enter password to continue.</p>
        <form id="passForm" autocomplete="off">
          <label for="password" class="sr-only">Password</label>
          <input id="password" name="password" type="password" inputmode="text" placeholder="Password" aria-required="true" />
          <div class="row">
            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="button" id="resetBtn" class="btn btn-ghost">Reset</button>
          </div>
        </form>
        <p id="passError" class="error hidden" role="alert"></p>
      </div>

      <div id="step-welcome" class="step hidden" aria-hidden="true">
        <p class="muted">Authentication successful.</p>
        <p class="welcome">Welcome, Cassandra Winters.</p>
        <div class="row">
          <a id="enterDash" class="btn btn-primary" href="dashboard.html">Enter Dashboard</a>
          <button id="logoutAfter" class="btn btn-ghost">Log out</button>
        </div>
      </div>

    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
