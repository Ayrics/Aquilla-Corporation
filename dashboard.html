<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cassandra Winters — Dashboard</title>
  <meta name="description" content="Dashboard listing multiple files." />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-white text-dark">
  <header class="site-header dash-header">
    <div class="container header-inner">
      <h1 class="brand small">Cassandra Winters — Dashboard</h1>
      <div class="header-actions">
        <input id="fileSearch" class="search" type="search" placeholder="Search files…" aria-label="Search files" />
        <button id="logout" class="btn btn-ghost">Logout</button>
      </div>
    </div>
  </header>

  <main class="container dashboard modern-dashboard">
    <section class="files-list" aria-labelledby="files-heading">
      <h2 id="files-heading">Files</h2>
      <p class="muted">Click a file to open it in the viewer.</p>

      <ul id="fileItems" class="file-grid cards" role="list">
        <li>
          <button class="file-card" data-path="files/Gigantic Biblical Angel Depiction.txt">
            <div class="file-meta">
              <strong>Gigantic Biblical Angel Depiction</strong>
              <span class="file-type">Text</span>
            </div>
            <div class="file-preview">A dramatic depiction — click to open</div>
          </button>
        </li>
        <li>
          <button class="file-card" data-path="files/Grotesque-Looking Horse.txt">
            <div class="file-meta">
              <strong>Grotesque-Looking Horse</strong>
              <span class="file-type">Text</span>
            </div>
            <div class="file-preview">Strange horsemanship notes</div>
          </button>
        </li>
        <li>
          <button class="file-card" data-path="files/Person With An Odd Face Mutations.txt">
            <div class="file-meta">
              <strong>Person With An Odd Face Mutations</strong>
              <span class="file-type">Text</span>
            </div>
            <div class="file-preview">Observations and anomalies</div>
          </button>
        </li>
        <li>
          <button class="file-card" data-path="files/Maniacally ‘Laughing’ Cricket Horde.txt">
            <div class="file-meta">
              <strong>Maniacally ‘Laughing’ Cricket Horde</strong>
              <span class="file-type">Text</span>
            </div>
            <div class="file-preview">Field notes</div>
          </button>
        </li>
      </ul>
    </section>

    <section class="file-viewer" aria-labelledby="viewer-heading">
      <div class="viewer-top">
        <h2 id="viewer-heading">Viewer</h2>
        <div class="viewer-actions">
          <a id="downloadLink" class="btn btn-primary hidden" download>Download file</a>
        </div>
      </div>
      <div id="viewerContainer" class="viewer empty">Select a file to view its contents.</div>
    </section>
  </main>

  <script src="script.js" defer></script>
  <script>
    // small search filter for the file cards
    document.addEventListener('DOMContentLoaded', () => {
      const search = document.getElementById('fileSearch');
      const list = document.getElementById('fileItems');
      if (!search || !list) return;
      search.addEventListener('input', (e) => {
        const q = (e.target.value || '').toLowerCase();
        for (const btn of list.querySelectorAll('button.file-card')) {
          const name = (btn.textContent || '').toLowerCase();
          btn.style.display = q && !name.includes(q) ? 'none' : '';
        }
      });
    });
  </script>
</body>
</html>
